services:
  postgres:
    image: postgres:16-alpine
    container_name: emblemix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: emblemix
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d emblemix"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: emblemix-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: emblemix-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/emblemix
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: 1025
      JWT_SECRET: dGVzdC1qd3Qtc2VjcmV0LWtleS1leGFtcGxlLTI1Ni1iaXQtbG9uZy12YWx1ZQ==
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      SALESFORCE_CLIENT_ID: ${SALESFORCE_CLIENT_ID:-emblemix-salesforce-client-id}
      SALESFORCE_CLIENT_SECRET: ${SALESFORCE_CLIENT_SECRET:-emblemix-salesforce-client-secret}
      SALESFORCE_REDIRECT_URI: ${SALESFORCE_REDIRECT_URI:-http://localhost:3000/salesforce}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: emblemix-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080

volumes:
  postgres_data:
