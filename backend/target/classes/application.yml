server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: emblemix-backend
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/emblemix}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 25
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

emblemix:
  security:
    jwt:
      # 256-bit Base64-encoded secret for HMAC-SHA256 signing
      secret: ${JWT_SECRET:dGVzdC1qd3Qtc2VjcmV0LWtleS1leGFtcGxlLTI1Ni1iaXQtbG9uZy12YWx1ZQ==}
      access-token-expiration-ms: ${JWT_EXPIRATION_MS:900000} # 15 minutes
      refresh-token-expiration-ms: ${REFRESH_TOKEN_EXPIRATION_MS:604800000} # 7 days
    # AES-256 (32 bytes) hex-encoded key for encrypting integration credentials at rest
    encryption-key: ${ENCRYPTION_KEY:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
  monitoring:
    pool-size: 10
    default-interval-seconds: 60
    default-timeout-ms: 5000
    max-response-size-bytes: 1048576 # 1 MB
  salesforce:
    client-id: ${SALESFORCE_CLIENT_ID:emblemix-dummy-client-id}
    client-secret: ${SALESFORCE_CLIENT_SECRET:emblemix-dummy-client-secret}
    redirect-uri: ${SALESFORCE_REDIRECT_URI:http://localhost:5173/integrations/salesforce/callback}
    production-login-url: ${SALESFORCE_PRODUCTION_LOGIN_URL:https://login.salesforce.com}
    sandbox-login-url: ${SALESFORCE_SANDBOX_LOGIN_URL:https://test.salesforce.com}
    api-version: ${SALESFORCE_API_VERSION:v61.0}
