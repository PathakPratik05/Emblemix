server:
  port: 0

spring:
  application:
    name: emblemix-backend-test
  datasource:
    url: jdbc:h2:mem:emblemix_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: localhost
    port: 1025

emblemix:
  security:
    jwt:
      secret: dGVzdC1qd3Qtc2VjcmV0LWtleS1leGFtcGxlLTI1Ni1iaXQtbG9uZy12YWx1ZQ==
      access-token-expiration-ms: 3600000
      refresh-token-expiration-ms: 86400000
    encryption-key: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  monitoring:
    pool-size: 2
    default-interval-seconds: 10
    default-timeout-ms: 2000
    max-response-size-bytes: 65536
  salesforce:
    client-id: test-client-id
    client-secret: test-client-secret
    redirect-uri: http://localhost:5173/integrations/salesforce/callback
    production-login-url: http://localhost:8089
    sandbox-login-url: http://localhost:8089
    api-version: v61.0
